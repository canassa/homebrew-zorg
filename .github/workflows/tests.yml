name: tests

# Installs and tests the formula on every platform zorg ships for. The
# formula is rendered and pushed by canassa/zorg's release workflow, so a
# push here is usually a new release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    if: hashFiles('Formula/zorg.rb') != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: brew style canassa/zorg
      - run: brew audit --strict --online --formula canassa/zorg/zorg
      - run: brew install --formula canassa/zorg/zorg
      - run: brew test canassa/zorg/zorg
      - run: brew linkage --test canassa/zorg/zorg || true
